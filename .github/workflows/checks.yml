name: Source and behavior checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: rustup show
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: npm run contract:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --features desktop -j 1 -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --features desktop -j 1
      - run: npm run build
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features desktop --bin singalong-desktop
      - run: npm run check:native-manifest -- -Executable src-tauri/target/debug/singalong-desktop.exe
      - run: npx playwright install chrome
      - run: npm run test:e2e
